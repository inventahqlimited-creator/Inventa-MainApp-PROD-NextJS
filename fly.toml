# fly.toml app configuration file generated for inventa-mainapp-prod-nextjs on 2026-09-08T03:53:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'inventa-mainapp-prod-nextjs'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    NEXT_PUBLIC_APP_URL = 'https://inventahq.fly.dev'
    NEXT_PUBLIC_SUPABASE_ANON_KEY = ''
    NEXT_PUBLIC_SUPABASE_URL = ''

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    interval = '15s'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
