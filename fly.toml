# fly.toml — inventaHQ on Fly.io
# Deploy: fly deploy
# Docs:   https://fly.io/docs/reference/configuration/

app    = "inventahq"
primary_region = "syd"   # Sydney — closest to NZ/AU

[build]
  dockerfile = "Dockerfile"

[build.args]
  # NEXT_PUBLIC_* vars are baked into the JS bundle at build time.
  # Set these as Fly build secrets: fly secrets set NEXT_PUBLIC_SUPABASE_URL=...
  NEXT_PUBLIC_SUPABASE_URL      = ""
  NEXT_PUBLIC_SUPABASE_ANON_KEY = ""
  NEXT_PUBLIC_APP_URL           = "https://inventahq.fly.dev"

[env]
  PORT     = "3000"
  NODE_ENV = "production"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 200
    soft_limit = 150

[[vm]]
  size = "shared-cpu-1x"   # Upgrade to performance-1x when traffic grows
  memory = "512mb"

[checks]
  [checks.health]
    port     = 3000
    type     = "http"
    interval = "15s"
    timeout  = "5s"
    path     = "/api/health"
